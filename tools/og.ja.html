<!-- og.ja.png 的源文件，版式和 og.html 一样。数字由 node tools/sync-stats.mjs 回写并重新截图。 -->
<!doctype html><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  background:#fff;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;
  background:radial-gradient(700px 420px at 88% 8%, rgba(100,108,255,.16), transparent 70%),
             radial-gradient(560px 380px at 4% 100%, rgba(16,185,129,.12), transparent 70%)}
.grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(#eceded 1px,transparent 1px),linear-gradient(90deg,#eceded 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 78%)}
.in{position:relative;padding:76px 84px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-size:23px;color:#3c3c43b8;font-weight:600;letter-spacing:.02em}
.logo{width:44px;height:44px;border-radius:11px;background:#3451b2;color:#fff;font-size:26px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.logo svg{width:28px;height:28px}
h1{margin-top:52px;font-size:76px;line-height:1.12;letter-spacing:-.02em;color:#1b1b1f;font-weight:700}
h1 em{font-style:normal;color:#3451b2}
p{margin-top:26px;font-size:29px;white-space:nowrap;line-height:1.6;color:#3c3c43c7;max-width:960px}
.chips{margin-top:auto;margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap}
.c{font-size:21px;font-weight:600;padding:11px 18px;border-radius:999px;background:#f6f6f7;color:#3c3c43c7;border:1px solid #e2e2e3}
.c b{color:#1b1b1f}
.c.a{background:rgba(16,185,129,.12);border-color:transparent;color:#18794e}
.c.u{background:rgba(100,108,255,.14);border-color:transparent;color:#3451b2}
.bar{position:absolute;left:0;top:0;width:100%;height:8px;background:linear-gradient(90deg,#3451b2,#5672cd 45%,#18794e)}
</style>
<div class="bg"></div><div class="grid"></div><div class="bar"></div>
<div class="in">
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>日本で暮らす外国人のためのコスパ生活ガイド</div>
  <h1>日本で暮らす外国人へ：<br><em>遠回りせず、一線を越えない</em></h1>
  <p>在留資格 · 税金と年金 · 医療 · 救急 · 詐欺 · 法律の一線 · 仕事 · 住まい</p>
  <div class="chips">
    <div class="c u"><b>349</b> 項目の助言</div>
    <div class="c a">エビデンスA <b>221</b> 件</div>
    <div class="c"><b>686</b> 件の一次資料リンク</div>
    <div class="c">本文は中国語・英語</div>
  </div>
</div>
